name: Auto 表示順 (Multi-level)

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: read
  repository-projects: write

concurrency:
  group: auto-display-order
  cancel-in-progress: false

jobs:
  sort:
    runs-on: ubuntu-latest

    steps:
      - name: Update 表示順 field in Projects
        uses: actions/github-script@v7
        with:
          script: |
            await (async () => {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const fieldName = '表示順';

              async function fetchAllIssues() {
                const issues = [];
                let cursor = null;

                while (true) {
                  const response = await github.graphql(
                    `
                      query($owner: String!, $repo: String!, $cursor: String) {
                        repository(owner: $owner, name: $repo) {
                          issues(
                            first: 100
                            after: $cursor
                            states: [OPEN, CLOSED]
                            orderBy: {field: CREATED_AT, direction: ASC}
                          ) {
                            nodes {
                              id
                              number
                              title
                              parent {
                                number
                              }
                              projectItems(first: 20) {
                                nodes {
                                  id
                                  project {
                                    __typename
                                    ... on ProjectV2 {
                                      id
                                      title
                                    }
                                  }
                                }
                              }
                            }
                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    `,
                    { owner, repo, cursor }
                  );

                  const connection = response.repository.issues;
                  issues.push(...connection.nodes);

                  if (!connection.pageInfo.hasNextPage) {
                    return issues;
                  }

                  cursor = connection.pageInfo.endCursor;
                }
              }

              async function fetchProjectFields() {
                const response = await github.graphql(
                  `
                    query($owner: String!, $repo: String!) {
                      repository(owner: $owner, name: $repo) {
                        projectsV2(first: 20) {
                          nodes {
                            id
                            title
                            fields(first: 50) {
                              nodes {
                                ... on ProjectV2FieldCommon {
                                  id
                                  name
                                  dataType
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `,
                  { owner, repo }
                );

                return response.repository.projectsV2.nodes;
              }

              const issues = await fetchAllIssues();
              const projects = await fetchProjectFields();

              core.info(`Fetched ${issues.length} issues and ${projects.length} projects.`);

              const orderFieldByProjectId = new Map(
                projects
                  .map((project) => {
                    const field = project.fields.nodes.find(
                      (candidate) => candidate && candidate.name === fieldName && candidate.dataType === 'TEXT'
                    );
                    return field ? [project.id, { projectTitle: project.title, fieldId: field.id }] : null;
                  })
                  .filter(Boolean)
              );

              if (orderFieldByProjectId.size === 0) {
                core.warning(`No TEXT field named "${fieldName}" was found in repository projects.`);
                return;
              }

              const childrenByParent = new Map();
              const roots = [];

              for (const issue of issues) {
                const parentNumber = issue.parent?.number ?? null;
                if (parentNumber === null) {
                  roots.push(issue);
                } else {
                  const siblings = childrenByParent.get(parentNumber) ?? [];
                  siblings.push(issue);
                  childrenByParent.set(parentNumber, siblings);
                }
              }

              roots.sort((a, b) => a.number - b.number);
              for (const siblings of childrenByParent.values()) {
                siblings.sort((a, b) => a.number - b.number);
              }

              const orderByIssueNumber = new Map();

              function assignOrders(issueList, prefix = '') {
                issueList.forEach((issue, index) => {
                  const order = prefix ? `${prefix}.${index + 1}` : `${index + 1}`;
                  orderByIssueNumber.set(issue.number, order);
                  assignOrders(childrenByParent.get(issue.number) ?? [], order);
                });
              }

              assignOrders(roots);

              const updateMutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { text: $value }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `;

              for (const issue of issues) {
                const order = orderByIssueNumber.get(issue.number);
                if (!order) {
                  core.warning(`No order was generated for issue #${issue.number}.`);
                  continue;
                }

                let updatedAnyItem = false;

                for (const item of issue.projectItems.nodes) {
                  if (!item?.project || item.project.__typename !== 'ProjectV2') {
                    continue;
                  }

                  const field = orderFieldByProjectId.get(item.project.id);
                  if (!field) {
                    continue;
                  }

                  await github.graphql(updateMutation, {
                    projectId: item.project.id,
                    itemId: item.id,
                    fieldId: field.fieldId,
                    value: order
                  });

                  updatedAnyItem = true;
                  core.info(
                    `Updated project "${field.projectTitle}" for issue #${issue.number} (${issue.title}) to ${fieldName}=${order}`
                  );
                }

                if (!updatedAnyItem) {
                  core.info(`Skipped issue #${issue.number} because no matching project item was found.`);
                }
              }
            })();
