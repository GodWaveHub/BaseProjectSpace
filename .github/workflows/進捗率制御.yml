name: 進捗率制御

on:
  schedule:
    - cron: '*/30 * * * *'   # 30分ごとに自動実行
  workflow_dispatch:
    inputs:
      project_node_id:
        description: 'GitHub Project の Node ID（省略時はリポジトリ変数 PROJECT_NODE_ID を使用）'
        required: false
        default: ''

# -------------------------------------------------------
# 【重要】GitHub Projects V2 の GraphQL API を使用するため
#   - GITHUB_TOKEN では Organization レベルのプロジェクトにアクセスできない場合があります。
#   - その場合は `project` スコープを持つ PAT を Secrets に PAT_TOKEN として登録してください。
#     Settings > Secrets and variables > Actions > New repository secret
# -------------------------------------------------------
permissions:
  issues: read
  contents: read
  repository-projects: write  # リポジトリレベルの Projects アクセス

jobs:
  recalculate-progress:
    name: 全アイテムの進捗率[%]を再計算
    runs-on: ubuntu-latest
    steps:
      - name: 進捗率を再帰的に再計算
        uses: actions/github-script@v7
        with:
          # PAT_TOKEN（project スコープ必須）が設定されていればそちらを優先
          # 未設定の場合は GITHUB_TOKEN にフォールバック（Organization プロジェクトは要PAT）
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            // -------------------------------------------------------
            // プロジェクト Node ID の決定
            //   1. workflow_dispatch の入力値
            //   2. リポジトリ変数 PROJECT_NODE_ID
            // -------------------------------------------------------
            const projectNodeId =
              '${{ inputs.project_node_id }}'.trim() ||
              '${{ vars.PROJECT_NODE_ID }}'.trim();

            if (!projectNodeId) {
              core.setFailed(
                'プロジェクトの Node ID が未設定です。\n' +
                'workflow_dispatch の入力値、またはリポジトリ変数 PROJECT_NODE_ID を設定してください。'
              );
              return;
            }

            console.log(`対象プロジェクト: ${projectNodeId}`);

            // -------------------------------------------------------
            // ヘルパー: プロジェクト内アイテムを Issue 番号で検索
            // -------------------------------------------------------
            async function getProgressFromItem(targetIssueNumber, pNodeId) {
              let cursor = null;
              let found = null;
              do {
                const result = await github.graphql(`
                  query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 50, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id
                            content {
                              ... on Issue { number }
                            }
                            fieldValues(first: 20) {
                              nodes {
                                ... on ProjectV2ItemFieldNumberValue {
                                  number
                                  field {
                                    ... on ProjectV2FieldCommon { name id }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { projectId: pNodeId, cursor });

                for (const pi of result.node.items.nodes) {
                  if (pi.content && pi.content.number === targetIssueNumber) {
                    found = pi;
                    break;
                  }
                }
                if (found) break;
                cursor = result.node.items.pageInfo.hasNextPage
                  ? result.node.items.pageInfo.endCursor
                  : null;
              } while (cursor);

              if (!found) return { itemId: null, rate: null, fieldId: null };

              let rate = null;
              let fId = null;
              for (const fv of found.fieldValues.nodes) {
                if (fv.field && fv.field.name === '進捗率[%]') {
                  rate = fv.number ?? null;
                  fId = fv.field.id;
                  break;
                }
              }
              return { itemId: found.id, rate, fieldId: fId };
            }

            // -------------------------------------------------------
            // ヘルパー: 親 Issue の進捗率を子の平均で更新し再帰
            // -------------------------------------------------------
            const updatedIssues = new Set(); // 無限ループ防止

            async function updateParentProgress(targetIssueNumber, currentProgress, progressFieldId) {
              if (updatedIssues.has(targetIssueNumber)) {
                console.log(`Issue #${targetIssueNumber} は処理済みのためスキップします。`);
                return;
              }

              // タイムラインから親 Issue を特定
              const timelineEvents = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: targetIssueNumber,
                  per_page: 100
                }
              );

              let parentNumber = null;
              for (const event of timelineEvents) {
                if (event.event === 'added_to_parent' && event.parent) {
                  parentNumber = event.parent.number;
                } else if (event.event === 'removed_from_parent' && event.parent) {
                  if (event.parent.number === parentNumber) parentNumber = null;
                }
              }

              if (!parentNumber) {
                console.log(`Issue #${targetIssueNumber} には親 Issue がありません。再帰終了。`);
                return;
              }
              console.log(`  親 Issue: #${parentNumber}`);

              // 親のタイムラインから子 Issue 一覧を取得
              const parentTimeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parentNumber,
                  per_page: 100
                }
              );

              const childNumbers = new Set();
              for (const event of parentTimeline) {
                if (event.event === 'added_to_sub_issue' && event.sub_issue) {
                  childNumbers.add(event.sub_issue.number);
                } else if (event.event === 'removed_from_sub_issue' && event.sub_issue) {
                  childNumbers.delete(event.sub_issue.number);
                }
              }

              // 各子 Issue の進捗率[%] をプロジェクトの Custom Field から取得
              const rates = [];
              let sharedFieldId = progressFieldId;
              for (const childNumber of childNumbers) {
                let rate;
                if (childNumber === targetIssueNumber) {
                  rate = currentProgress;
                } else {
                  const result = await getProgressFromItem(childNumber, projectNodeId);
                  rate = result.rate;
                  if (!sharedFieldId && result.fieldId) sharedFieldId = result.fieldId;
                }
                if (rate !== null && rate !== undefined) {
                  rates.push(rate);
                  console.log(`    子 Issue #${childNumber}: 進捗率 ${rate}%`);
                } else {
                  console.log(`    子 Issue #${childNumber}: 進捗率 未設定 (計算から除外)`);
                }
              }

              if (rates.length === 0) {
                console.log('進捗率が設定された子 Issue が見つかりません。スキップします。');
                return;
              }

              // 平均値を計算（小数点以下は四捨五入）
              const average = Math.round(rates.reduce((a, b) => a + b, 0) / rates.length);
              console.log(`  親 Issue #${parentNumber} の新しい進捗率: ${average}%`);

              // 親 Issue のプロジェクトアイテムを取得
              const parentResult = await getProgressFromItem(parentNumber, projectNodeId);
              if (!parentResult.itemId) {
                console.log(`親 Issue #${parentNumber} がプロジェクトに見つかりません。スキップします。`);
                return;
              }

              const parentFieldId = parentResult.fieldId || sharedFieldId;
              if (!parentFieldId) {
                console.log('「進捗率[%]」フィールド ID が特定できません。スキップします。');
                return;
              }

              if (parentResult.rate === average) {
                console.log(`  親 Issue #${parentNumber} の進捗率は既に ${average}% です。更新不要。`);
              } else {
                // 親 Issue のプロジェクト Custom Field を更新
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: Float!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { number: $value }
                    }) {
                      projectV2Item { id }
                    }
                  }
                `, {
                  projectId: projectNodeId,
                  itemId: parentResult.itemId,
                  fieldId: parentFieldId,
                  value: average
                });
                console.log(`  → 親 Issue #${parentNumber} を ${average}% に更新しました`);
                updatedIssues.add(parentNumber);
              }

              // さらに上位の親を再帰的に更新
              await updateParentProgress(parentNumber, average, parentFieldId);
            }

            // -------------------------------------------------------
            // プロジェクト内の全アイテムをスキャンして再計算
            // -------------------------------------------------------
            let cursor = null;
            let processedCount = 0;

            do {
              const result = await github.graphql(`
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 50, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          content {
                            ... on Issue { number title }
                          }
                          fieldValues(first: 20) {
                            nodes {
                              ... on ProjectV2ItemFieldNumberValue {
                                number
                                field {
                                  ... on ProjectV2FieldCommon { name id }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { projectId: projectNodeId, cursor });

              for (const item of result.node.items.nodes) {
                if (!item.content || item.content.number === undefined) continue;

                const issueNumber = item.content.number;
                let progressRate = null;
                let progressFieldId = null;

                for (const fv of item.fieldValues.nodes) {
                  if (fv.field && fv.field.name === '進捗率[%]') {
                    progressRate = fv.number ?? null;
                    progressFieldId = fv.field.id;
                    break;
                  }
                }

                if (progressRate === null) {
                  console.log(`Issue #${issueNumber} "${item.content.title}": 進捗率 未設定 (スキップ)`);
                  continue;
                }

                console.log(`\nIssue #${issueNumber} "${item.content.title}": 進捗率 ${progressRate}% → 親を更新`);
                await updateParentProgress(issueNumber, progressRate, progressFieldId);
                processedCount++;
              }

              cursor = result.node.items.pageInfo.hasNextPage
                ? result.node.items.pageInfo.endCursor
                : null;
            } while (cursor);

            console.log(`\n完了: ${processedCount} 件の Issue を処理しました。`);
