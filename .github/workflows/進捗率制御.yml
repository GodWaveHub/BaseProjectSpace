name: 進捗率制御

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]

permissions:
  issues: write
  contents: read

jobs:
  initialize-progress:
    # issue作成時に進捗率[%]を0で初期化
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: 進捗率を0で初期化
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const progressLine = '進捗率[%]: 0';

            // 既に進捗率の行がある場合はスキップ
            if (body.includes('進捗率[%]:')) {
              console.log('進捗率[%] は既に設定されています');
              return;
            }

            // issue bodyに進捗率を追加
            const newBody = body ? `${body}\n\n${progressLine}` : progressLine;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: newBody
            });
            console.log(`Issue #${issue.number} の進捗率[%]を0で初期化しました`);

  update-parent-progress:
    # issue編集時に親の進捗率[%]を再計算
    if: github.event.action != 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: 親の進捗率を再計算
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // issueのbodyから進捗率[%]の値を取得する関数
            function getProgressRate(body) {
              if (!body) return null;
              const match = body.match(/進捗率\[%\]:\s*(\d+(?:\.\d+)?)/);
              return match ? parseFloat(match[1]) : null;
            }

            // issueのbodyの進捗率[%]を更新する関数
            function updateProgressInBody(body, newRate) {
              if (!body) return `進捗率[%]: ${newRate}`;
              if (body.match(/進捗率\[%\]:\s*\d+(?:\.\d+)?/)) {
                return body.replace(
                  /進捗率\[%\]:\s*\d+(?:\.\d+)?/,
                  `進捗率[%]: ${newRate}`
                );
              }
              return `${body}\n\n進捗率[%]: ${newRate}`;
            }

            // 進捗率の変更があったか確認
            const issue = context.payload.issue;
            const currentBody = issue.body || '';
            const changes = context.payload.changes;

            const newRate = getProgressRate(currentBody);

            // bodyの変更がある場合、進捗率が変わっていなければスキップ
            if (changes && changes.body) {
              const oldRate = getProgressRate(changes.body.from);
              if (oldRate === null && newRate === null) {
                console.log('進捗率[%]が設定されていない編集です。スキップします。');
                return;
              }
              if (oldRate !== null && newRate !== null && oldRate === newRate) {
                console.log('進捗率[%]の変更なし。スキップします。');
                return;
              }
              console.log(`Issue #${issue.number} の進捗率: ${oldRate} → ${newRate}`);
            } else {
              // bodyの変更がなくても進捗率があれば親の再計算を試みる
              if (newRate === null) {
                console.log('進捗率[%]が設定されていません。スキップします。');
                return;
              }
              console.log(`Issue #${issue.number} の進捗率: ${newRate}（body以外の変更による再計算）`);
            }

            // 親issueを再帰的に更新する関数
            async function updateParentProgress(issueNumber) {
              // REST API で対象issueのタイムラインイベントから親issueを特定
              // （Sub-issues progressは使わず、親子関係のみ取得）
              const timelineEvents = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100
                }
              );

              // タイムラインから "added_to_parent" イベントで親issueを特定
              let parentNumber = null;
              for (const event of timelineEvents) {
                if (event.event === 'added_to_parent' && event.parent) {
                  parentNumber = event.parent.number;
                } else if (event.event === 'removed_from_parent' && event.parent) {
                  // 親から外された場合はリセット
                  if (event.parent.number === parentNumber) {
                    parentNumber = null;
                  }
                }
              }

              if (!parentNumber) {
                console.log(`Issue #${issueNumber} には親issueがありません。再帰終了。`);
                return;
              }
              console.log(`親issue: #${parentNumber}`);

              // 親issueのタイムラインから子issue一覧を取得
              const parentTimeline = await github.paginate(
                github.rest.issues.listEventsForTimeline,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parentNumber,
                  per_page: 100
                }
              );

              // "added_to_sub_issue" イベントから子issue番号を収集
              const childNumbers = new Set();
              for (const event of parentTimeline) {
                if (event.event === 'added_to_sub_issue' && event.sub_issue) {
                  childNumbers.add(event.sub_issue.number);
                } else if (event.event === 'removed_from_sub_issue' && event.sub_issue) {
                  childNumbers.delete(event.sub_issue.number);
                }
              }

              // 各子issueのbodyをREST APIで個別取得し、進捗率を収集
              const rates = [];
              for (const childNumber of childNumbers) {
                let childBody;
                if (childNumber === issue.number) {
                  // 現在編集中のissueの場合、イベントペイロードの最新bodyを使用
                  childBody = currentBody;
                } else {
                  const childIssue = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: childNumber
                  });
                  childBody = childIssue.data.body || '';
                }
                const rate = getProgressRate(childBody);
                if (rate !== null) {
                  rates.push(rate);
                  console.log(`  子issue #${childNumber}: 進捗率 ${rate}%`);
                } else {
                  console.log(`  子issue #${childNumber}: 進捗率 未設定(計算から除外)`);
                }
              }

              if (rates.length === 0) {
                console.log('進捗率が設定された子issueが見つかりません。スキップします。');
                return;
              }

              // 平均値を計算（小数点以下は四捨五入）
              const average = Math.round(rates.reduce((a, b) => a + b, 0) / rates.length);
              console.log(`親issue #${parentNumber} の新しい進捗率: ${average}%`);

              // 親issueのbodyを取得して更新
              const parentIssue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber
              });

              const parentBody = parentIssue.data.body || '';
              const currentParentRate = getProgressRate(parentBody);

              // 親の進捗率が同じ値なら更新不要
              if (currentParentRate === average) {
                console.log(`親issue #${parentNumber} の進捗率は既に ${average}% です。更新不要。`);
                return;
              }

              const newParentBody = updateProgressInBody(parentBody, average);

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parentNumber,
                body: newParentBody
              });

              console.log(`親issue #${parentNumber} の進捗率を ${average}% に更新しました`);

              // さらに上位の親を再帰的に更新
              await updateParentProgress(parentNumber);
            }

            // 親issueの更新を開始
            await updateParentProgress(issue.number);
